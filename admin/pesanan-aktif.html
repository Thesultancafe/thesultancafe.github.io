<!DOCTYPE html>

<html lang="id">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
    Pesanan Aktif | The Sultan Cafe
</title>

<!-- FONT AWESOME -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- POS CSS -->
<link
    rel="stylesheet"
    href="pos.css">

<style>

    /* ==========================================
       HALAMAN PESANAN AKTIF
       ========================================== */

    body {

        background: #f5f5f5;

    }


    .active-orders-page {

        width: 100%;

        max-width: 1100px;

        margin: 0 auto;

        padding: 20px;

    }


    /* ==========================================
       HEADER HALAMAN
       ========================================== */

    .active-orders-page-header {

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 15px;

        margin-bottom: 15px;

    }


    .active-orders-title {

        display: flex;

        align-items: center;

        gap: 10px;

    }


    .active-orders-title i {

        font-size: 20px;

    }


    .active-orders-title h2 {

        font-size: 20px;

        margin: 0;

    }


    .active-orders-title p {

        margin-top: 3px;

        font-size: 12px;

        color: #777;

    }


    .active-orders-actions {

        display: flex;

        gap: 7px;

    }


    .active-orders-actions button {

        padding: 8px 11px;

        font-size: 12px;

    }


    /* ==========================================
       DAFTAR PESANAN
       ========================================== */

    #activeOrdersList {

        display: flex;

        flex-direction: column;

        gap: 7px;

    }


    .active-order-card {

        display: grid;

        grid-template-columns:
            120px
            minmax(150px, 1fr)
            90px
            120px
            70px;

        align-items: center;

        gap: 12px;

        padding: 10px 12px;

        background: #fff;

        border: 1px solid #ddd;

        border-radius: 8px;

    }


    .active-order-code {

        font-size: 13px;

        font-weight: 700;

    }


    .active-order-customer {

        display: flex;

        flex-direction: column;

        gap: 2px;

    }


    .active-order-customer strong {

        font-size: 13px;

    }


    .active-order-customer span {

        font-size: 11px;

        color: #777;

    }


    .active-order-table {

        font-size: 12px;

        color: #555;

    }


    .active-order-total {

        font-size: 13px;

        font-weight: 700;

    }


    .btn-open-active-order {

        width: 100%;

        padding: 7px 8px;

        font-size: 11px;

    }


    /* ==========================================
       KOSONG
       ========================================== */

    .active-orders-empty-page {

        min-height: 180px;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        gap: 7px;

        background: #fff;

        border: 1px solid #ddd;

        border-radius: 8px;

        color: #888;

        text-align: center;

    }


    .active-orders-empty-page i {

        font-size: 26px;

    }


    .active-orders-empty-page p {

        font-size: 13px;

    }


    /* ==========================================
       ERROR
       ========================================== */

    .active-orders-error {

        padding: 15px;

        background: #fff;

        border: 1px solid #ddd;

        border-radius: 8px;

        color: #b00020;

        font-size: 13px;

    }


    /* ==========================================
       TABLET
       ========================================== */

    @media (max-width: 850px) {

        .active-orders-page {

            padding: 15px;

        }


        .active-order-card {

            grid-template-columns:
                110px
                1fr
                80px
                110px
                65px;

            gap: 8px;

            padding: 9px;

        }

    }


    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 600px) {

        .active-orders-page {

            padding: 10px;

        }


        .active-orders-page-header {

            align-items: flex-start;

        }


        .active-orders-title h2 {

            font-size: 17px;

        }


        .active-orders-title p {

            font-size: 11px;

        }


        .active-orders-actions {

            flex-direction: column;

        }


        .active-order-card {

            grid-template-columns:
                1fr
                1fr;

            gap: 7px;

            padding: 9px;

        }


        .active-order-code {

            grid-column: 1 / -1;

        }


        .active-order-total {

            font-size: 12px;

        }


        .btn-open-active-order {

            width: 100%;

        }

    }

</style>
```

</head>

<body>

<!-- ==========================================
     HALAMAN PESANAN AKTIF

<main class="active-orders-page">

```
<div class="active-orders-page-header">

    <div class="active-orders-title">

        <i class="fa-solid fa-list-check"></i>

        <div>

            <h2>
                Pesanan Aktif
            </h2>

            <p>
                Daftar pesanan yang sudah diterima dan belum dibayar.
            </p>

    <div class="active-orders-actions">

        <button

            Refresh

        </button>

    </div>

</div>


<!-- ======================================
     DAFTAR PESANAN
     ======================================= -->

<div id="activeOrdersList">

    <div class="active-orders-empty-page">

        <i class="fa-solid fa-receipt"></i>

        <p>
            Memuat pesanan aktif...
        </p>

    </div>

</div>
```

</main>

<!-- ==========================================
     SUPABASE
     ========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase.js"></script>

<!-- ==========================================
     JAVASCRIPT HALAMAN
     ========================================== -->

<script>

  
    /* ==========================================
       ELEMENT
       ========================================== */

    const activeOrdersList =
        document.getElementById(
            "activeOrdersList"
        );


    const btnRefreshActiveOrdersPage =
        document.getElementById(
            "btnRefreshActiveOrdersPage"
        );


    const btnBackPOS =
        document.getElementById(
            "btnBackPOS"
        );


    /* ==========================================
       FORMAT RUPIAH
       ========================================== */

    function formatRupiah(
        angka
    ) {

        return "Rp" +
            Number(
                angka || 0
            ).toLocaleString(
                "id-ID"
            );

    }


    /* ==========================================
       MUAT PESANAN AKTIF
       ========================================== */

    async function muatPesananAktifPage() {

        console.log(
            "⏳ Memuat pesanan aktif..."
        );


        try {

            const {
                data,
                error
            } = await supabaseClient

                .from(
                    "pesanan_customer"
                )

                .select("*")

                .eq(
                    "status",
                    "DITERIMA"
                )

                .order(
                    "created_at",
                    {
                        ascending: true
                    }
                );


            if (error) {

                throw error;

            }


            console.log(
                "📋 Pesanan aktif:",
                data
            );


            if (
                !data ||
                data.length === 0
            ) {

                activeOrdersList.innerHTML = `

                    <div
                        class="active-orders-empty-page">

                        <i class="fa-solid fa-receipt"></i>

                        <p>
                            Belum ada pesanan aktif
                        </p>

                    </div>

                `;

                return;

            }


            let html = "";


            data.forEach(
                function(pesanan) {

                    html += `

                        <div
                            class="active-order-card">

                            <div
                                class="active-order-code">

                                ${pesanan.kode_pesanan || "-"}

                            </div>


                            <div
                                class="active-order-customer">

                                <strong>
                                    ${pesanan.nama_pelanggan || "-"}
                                </strong>

                                <span>
                                    Pelanggan
                                </span>

                            </div>


                            <div
                                class="active-order-table">

                                Meja:
                                ${pesanan.nomor_meja || "-"}

                            </div>


                            <div
                                class="active-order-total">

                                ${formatRupiah(
                                    pesanan.total
                                )}

                            </div>


                            <button
                                type="button"
                                class="btn-primary btn-open-active-order"
                                data-id="${pesanan.id}">

                                <i class="fa-solid fa-folder-open"></i>

                                Buka

                            </button>

                        </div>

                    `;

                }
            );


            activeOrdersList.innerHTML =
                html;


        } catch (error) {

            console.error(
                "❌ Gagal memuat pesanan aktif:",
                error
            );


            activeOrdersList.innerHTML = `

                <div
                    class="active-orders-error">

                    Gagal memuat pesanan aktif.

                </div>

            `;

        }

    }


    /* ==========================================
       BUKA PESANAN
       ========================================== */

    activeOrdersList.addEventListener(
        "click",
        function(event) {

            const tombol =
                event.target.closest(
                    ".btn-open-active-order"
                );


            if (!tombol) {

                return;

            }


            const pesananId =
                tombol.dataset.id;


            if (!pesananId) {

                return;

            }


            /*
             * ID pesanan dikirim ke POS
             * melalui URL.
             */

            window.location.href =
                "pos.html?pesanan_id=" +
                encodeURIComponent(
                    pesananId
                );

        }
    );


    /* ==========================================
       REFRESH
       ========================================== */

    if (
        btnRefreshActiveOrdersPage
    ) {

        btnRefreshActiveOrdersPage.addEventListener(
            "click",
            function() {

                muatPesananAktifPage();

            }
        );

    }


    /* ==========================================
       KEMBALI KE POS
       ========================================== */

    if (btnBackPOS) {

        btnBackPOS.addEventListener(
            "click",
            function() {

                window.location.href =
                    "pos.html";

            }
        );

    }


    /* ==========================================
       LOAD AWAL
       ========================================== */

    muatPesananAktifPage();

</script>

</body>

</html>
